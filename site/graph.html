<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Graph</title><link rel="stylesheet" href="assets/style.css"></head><body><header><strong>Project Docs</strong><nav><a href="index.html">Dashboard</a><a href="catalog.html">Catalog</a><a href="packs.html">Packs</a><a href="standards.html">Standards</a><a href="profile.html">Profile</a><a href="traceability.html">Traceability</a><a href="graph.html">Graph</a><a href="flows.html">Diagrams</a></nav><button id="theme">◐</button></header><main><div class="crumb"></div><h1>Project Knowledge Graph</h1><p>Typed edges only. Click node to open its source document.</p><input id="gf" class="search" placeholder="Filter code/title/type"><div id="g" style="overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px"></div><script>const D={"nodes":[],"edges":[],"pages":{}};function render(){const f=document.getElementById('gf').value.toLowerCase();const nodes=D.nodes.filter(n=>!f||(n.code+' '+n.title+' '+n.type).toLowerCase().includes(f));const keep=new Set(nodes.map(n=>n.code));const types=[...new Set(nodes.map(n=>n.type))];const pos={};let maxY=0;types.forEach((t,xi)=>{nodes.filter(n=>n.type===t).forEach((n,yi)=>{pos[n.code]={x:30+xi*220,y:50+yi*78};maxY=Math.max(maxY,50+yi*78)})});let s='<svg width="'+Math.max(1000,types.length*220+100)+'" height="'+Math.max(500,maxY+120)+'">';for(const e of D.edges)if(keep.has(e.from)&&keep.has(e.to)){const a=pos[e.from],b=pos[e.to];s+='<line x1="'+(a.x+160)+'" y1="'+(a.y+22)+'" x2="'+b.x+'" y2="'+(b.y+22)+'" stroke="currentColor" opacity=".18"/><text x="'+((a.x+b.x)/2)+'" y="'+((a.y+b.y)/2)+'" font-size="9" fill="currentColor" opacity=".55">'+e.relationKey+'</text>'}for(const n of nodes){const p=pos[n.code];s+='<g class="node" onclick="location.href=''+(D.pages[n.code]||'#')+''"><rect x="'+p.x+'" y="'+p.y+'" width="160" height="44" rx="7" fill="var(--card)" stroke="var(--line)"/><text x="'+(p.x+8)+'" y="'+(p.y+17)+'" font-size="11" fill="currentColor">'+n.code+'</text><text x="'+(p.x+8)+'" y="'+(p.y+33)+'" font-size="10" fill="currentColor" opacity=".65">'+String(n.title).slice(0,23)+'</text></g>'}s+='</svg>';document.getElementById('g').innerHTML=s}document.getElementById('gf').oninput=render;render();</script></main><script src="assets/app.js"></script><script type="module" src="assets/mermaid-loader.js"></script></body></html>
