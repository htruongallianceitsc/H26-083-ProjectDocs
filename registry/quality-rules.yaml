rules:
  - id: feature-requirement
    description: Planned/active feature should link to at least one requirement.
  - id: requirement-test
    description: Approved/implemented requirement should have test coverage.
  - id: screen-feature
    description: Screen should trace to a feature.
  - id: api-feature
    description: API should trace to a feature.
  - id: no-broken-relations
    description: Every related code must resolve to exactly one entity.
  - id: no-duplicate-code
    description: Entity code must be globally unique.
