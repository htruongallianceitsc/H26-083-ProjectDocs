name: Documentation Quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/**'
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run docs:all
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site
