name: Documentation Quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'kit/registry/**'
      - 'tools/**'
      - 'project.profile.json'
      - 'starter-kit.json'
      - '.project-docs/workplans/**'
      - '.project-docs/spec-promotions/**'
      - '.project-docs/freshness/**'
      - '.project-docs/changesets/**'
      - '.project-docs/baselines/**'
      - '.project-docs/source.lock.json'
      - 'kit/source-bases/**'
      - 'apps/**'
      - 'packages/**'
      - 'kit/templates/**/*.json'
      - 'kit/reuse/capabilities/**'
      - 'kit/reuse/patterns/**'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'kit/registry/**'
      - 'tools/**'
      - 'project.profile.json'
      - 'starter-kit.json'
      - '.project-docs/workplans/**'
      - '.project-docs/spec-promotions/**'
      - '.project-docs/freshness/**'
      - '.project-docs/changesets/**'
      - '.project-docs/baselines/**'
      - '.project-docs/source.lock.json'
      - 'kit/source-bases/**'
      - 'apps/**'
      - 'packages/**'
      - 'kit/templates/**/*.json'
      - 'kit/reuse/capabilities/**'
      - 'kit/reuse/patterns/**'

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm run qa
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: .project-docs/site
