name: Documentation Quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'registry/**'
      - 'tools/**'
      - 'project.profile.json'
      - 'starter-kit.json'
      - 'reusable-modules/**'
      - 'reusable-patterns/**'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'registry/**'
      - 'tools/**'
      - 'project.profile.json'
      - 'starter-kit.json'
      - 'reusable-modules/**'
      - 'reusable-patterns/**'

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm run qa
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site
